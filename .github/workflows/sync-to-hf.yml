# Deploys the app to Hugging Face Spaces on every push to main.
# Needs a GitHub secret HF_TOKEN (a Hugging Face token with WRITE access).
name: Deploy to Hugging Face Space
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 1 }
      - name: Push to Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_USER: cdp336
          SPACE: customer-opportunity-desk
        run: |
          cp hf/README.md README.md
          rm -rf .git && git init -q -b main
          git config user.email "deploy@users.noreply.github.com" && git config user.name "deploy"
          git add -A && git commit -q -m "Deploy from GitHub ${GITHUB_SHA::7}"
          git push --force "https://${HF_USER}:${HF_TOKEN}@huggingface.co/spaces/${HF_USER}/${SPACE}" main
